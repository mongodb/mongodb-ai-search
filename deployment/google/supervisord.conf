[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; ── nginx — serves React SPA on 8080 and proxies to the two backends ─────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── FastAPI REST server — internal only on 127.0.0.1:8000 ────────────────────
[program:uvicorn]
command=uvicorn searchaas.api.app:app
    --host 127.0.0.1
    --port 8000
    --workers 1
    --log-level info
directory=/app
autostart=true
autorestart=true
priority=20
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── FastMCP server — internal only on 127.0.0.1:8001 ────────────────────────
[program:mcp]
command=python -m searchaas.mcp_server.server
directory=/app
autostart=true
autorestart=true
priority=20
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1",PYTHONPATH="/app"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
