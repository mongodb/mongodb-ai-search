server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;

    # ── FastAPI REST endpoints ─────────────────────────────────────────────
    # Matches /health /diagnose /retrieve /retrieve/* /query /settings /docs /redoc /openapi.json
    location ~ ^/(health|diagnose|retrieve|query|settings|docs|redoc|openapi\.json) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── FastMCP (Streamable HTTP / SSE) ───────────────────────────────────
    location /mcp {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE / streaming — disable buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection        '';
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # ── React static assets (content-hash filenames — cache aggressively) ─
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Runtime config (injected at startup — never cache) ────────────────
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
