server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip static assets
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Runtime config — must never be cached so redeploys take effect
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
        try_files  $uri =404;
    }

    # Long-cache hashed build assets
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Simple health endpoint for Container Apps probes
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA history fallback — every unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
